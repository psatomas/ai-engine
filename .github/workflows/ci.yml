name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same PR/branch supersedes any in-flight run for it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only ever needs to read the repository.
permissions:
  contents: read

env:
  # Matches the floor declared in package.json's "engines.node" (">=20") — the version every
  # contributor and CI run is guaranteed to have available.
  NODE_VERSION: "20"

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prettier --check .

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # dist/ is gitignored and required by the real MCP stdio tests (they spawn the compiled
      # packages/mcp/dist/bin.js as a subprocess), so it must be built before the suite runs.
      - run: npm run build
      # Real Claude Code / Codex CLI invocations are never required here: neither CLI is on
      # PATH on a GitHub-hosted runner, and packages/providers/src/adapters.integration.test.ts
      # is written to degrade to a logged skip in that case rather than fail or need credentials.
      - run: npm test
